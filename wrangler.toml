name = "dink-url-manager"
main = "src/worker.tsx"
compatibility_date = "2026-05-02"
compatibility_flags = ["nodejs_compat"]
preview_urls = true

[vars]
# Set to true to prevent the creation of new webhook configurations.
DISABLE_NEW_CONFIGS = false

[[d1_databases]]
binding = "DB"
database_name = "dink-url-manager"
database_id = "e5790075-c05c-4ee4-ac4c-ad1f85da9ea9"
migrations_dir = "./migrations"

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[[routes]]
pattern = "dink.pajlada.se"
custom_domain = true

[[ratelimits]]
name = "CONFIG_CREATE_RATELIMIT"
namespace_id = "1001"
simple = { limit = 2, period = 10 }

[[ratelimits]]
name = "CONFIG_UPDATE_RATELIMIT"
namespace_id = "1002"
simple = { limit = 5, period = 10 }

[[ratelimits]]
name = "WEBHOOK_SECRET_RATELIMIT"
namespace_id = "1003"
simple = { limit = 100, period = 10 }

[[ratelimits]]
name = "WEBHOOK_IP_RATELIMIT"
namespace_id = "1004"
simple = { limit = 250, period = 10 }
